name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        # macos-15-intel is deliberately excluded: gmp (a build dependency of
        # shellcheck, needed by `brew style`) has no x86_64_sequoia bottle, so
        # that runner always compiles gmp from source against gmplib.org /
        # ftpmirror.gnu.org -- external mirrors outside Homebrew's own bottle
        # CDN -- which has proven unreliable and fails the job on that step
        # alone, unrelated to the cask itself. Revisit if an x86_64_sequoia
        # gmp bottle is published upstream.
        os: [ macos-26 ]
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - name: Audit rails-kit cask
        run: brew audit --cask --strict --online janstol/tap/rails-kit

      - name: Install rails-kit cask
        run: brew install --cask janstol/tap/rails-kit

      - name: Test rails-kit binary
        run: rails-kit version

      - name: Uninstall rails-kit cask
        if: always()
        run: brew uninstall --cask rails-kit || true
